name: hirecraft

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://hirecraft:${POSTGRES_PASSWORD:-hirecraft}@postgres:5432/hirecraft
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env - generate with `openssl rand -base64 48`}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  TEMPLATES_DIR: /app/templates
  ARTIFACTS_DIR: /app/artifacts
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
  # SMTP is optional: leave SMTP_HOST empty and emails are logged, not sent.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-HireCraft <no-reply@hirecraft.app>}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirecraft}
      POSTGRES_DB: hirecraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirecraft -d hirecraft"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes:
      - ./templates:/app/templates:ro
      - artifacts:/app/artifacts
      - tectonic_cache:/var/cache/tectonic
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run here rather than in the worker so concurrent workers cannot
    # race each other applying the same revision.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes:
      - ./templates:/app/templates:ro
      - artifacts:/app/artifacts
      - tectonic_cache:/var/cache/tectonic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Celery beat: fires scheduled jobs (reminders, digests) onto the queue that
  # `worker` then executes. Exactly one beat process must run, so this is its
  # own single-replica service rather than folded into the worker.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes:
      - ./templates:/app/templates:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    # The shared image bakes in an API healthcheck (curl :8000). Beat serves no
    # HTTP, so disable the inherited probe rather than flap to false-unhealthy.
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  artifacts:
  tectonic_cache:
