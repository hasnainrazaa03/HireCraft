<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", Inter, sans-serif;
        background: #14141b;
        color: #e9e9f0;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { font-size: 12px; color: #9a9aad; margin: 0 0 12px; }
      button {
        width: 100%;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      .primary { background: #7c4dff; color: #fff; margin-bottom: 8px; }
      .secondary { background: #24242f; color: #cfcfe0; }
      .field { margin-bottom: 10px; }
      label { display: block; font-size: 11px; color: #9a9aad; margin-bottom: 4px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        font-size: 12px;
        border-radius: 8px;
        border: 1px solid #2c2c3a;
        background: #1c1c26;
        color: #e9e9f0;
      }
      .status { font-size: 11px; color: #6ee7a8; margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>🛠️ HireCraft Job Clipper</h1>
    <p>Capture this job posting and open it in HireCraft's new-application flow.</p>

    <div class="field">
      <label for="appUrl">Your HireCraft URL</label>
      <input id="appUrl" placeholder="http://localhost:5173" />
    </div>

    <button id="clip" class="primary">Clip this job & open HireCraft</button>
    <button id="copy" class="secondary">Copy job text to clipboard</button>
    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
