# ---------------------------------------------------------------------------
# ATS boards to scrape. Every entry below was verified reachable on 2026-08-22.
#   greenhouse: token from  https://job-boards.greenhouse.io/<token>
#   lever:      token from  https://jobs.lever.co/<token>
#   ashby:      token from  https://jobs.ashbyhq.com/<token>
#   workday:    {tenant, host (wd1/wd5/...), site}  from
#               https://<tenant>.<host>.myworkdayjobs.com/<site>
# Add more with:  python scrape.py probe <token>     (tries all three ATSs)
#                 python scrape.py discover          (mines new tokens from SimplifyJobs)
# ---------------------------------------------------------------------------
