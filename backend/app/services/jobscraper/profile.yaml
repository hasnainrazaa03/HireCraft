                     "ai solutions"]
    skills: [llm, "large language", rag, "retriev*", langchain, llamaindex, pinecone,
             "vector", "embedding*", "prompt", "function calling", "tool call", "tool use",
             "agent*", openai, anthropic, claude, gpt, gemini, "eval*",
             "fine-tun*", "vision-language", "multimodal", "multi-modal", "chatbot", "copilot", fastapi,
             python, "hallucination", "guardrail", "rerank", "semantic search", "knowledge base",
