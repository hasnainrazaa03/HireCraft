  ds:
    label: "Data Science"
    resume: MHR_DataScience.pdf
    title_keywords: ["data scientist", "data science", "data analyst", "analytics",
                     "data engineer", "quantitative", "statistic*", "applied scientist",
                     "decision scien*", "experimentation", "business intelligence"]
    skills: [sql, pandas, numpy, "scikit", "statistic*", "hypothes*", "a/b", "ab test",
